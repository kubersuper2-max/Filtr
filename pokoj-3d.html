<style>
/* Layout: full-screen 3D stage, glass HUD pinned to top-left and bottom edge */
:root {
  --bg: #0b0d12;
  --panel: rgba(16, 19, 27, 0.72);
  --line: rgba(160, 176, 204, 0.18);
  --fg: #eef1f6;

  --accent: #00d4ff;
  --display: "Chakra Petch", "Inter", system-ui, sans-serif;
  --body: "Inter", system-ui, -apple-system, sans-serif;

}
html, body { height: 100%; overflow: hidden; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); -webkit-user-select: none; user-select: none; }
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }

.tag {
  position: fixed; z-index: 5;
  top: calc(env(safe-area-inset-top, 0px) + 12px);
  left: max(16px, env(safe-area-inset-left, 0px));
  padding: 10px 14px; border-radius: 14px;
  background: var(--panel); border: 1px solid var(--line);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
}
.tag .name { font-family: var(--display); font-weight: 600; font-size: 18px; letter-spacing: 0.02em; display: flex; align-items: center; gap: 8px; }
.tag .num { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--fg); font-size: 12px; }
.tag .dims { color: var(--muted); font-size: 12px; margin-top: 2px; font-variant-numeric: tabular-nums; }

.hud {
  position: fixed; z-index: 5; left: 0; right: 0; bottom: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(env(safe-area-inset-bottom, 0px) + 14px);
  display: flex; justify-content: center; pointer-events: none;
}
.dock {
  pointer-events: auto; width: 100%; max-width: 460px;
  display: flex; flex-direction: column; gap: 10px;
  padding: 12px; border-radius: 20px;
  background: var(--panel); border: 1px solid var(--line);
  -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
}
.label { font-family: var(--display); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.swatches { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.sw {
  flex: 1; height: 32px; border-radius: 10px; border: 2px solid transparent; cursor: pointer;
  background: var(--c); box-shadow: 0 0 14px -4px var(--c);
}
.sw[aria-pressed="true"] { border-color: var(--fg); }
.sw.rainbow { background: linear-gradient(90deg, #ff3b6b, #ffb23b, #3bff9d, #3bc8ff, #a35bff); --c: #a35bff; }
.sw.off { background: #1b1f28; --c: transparent; position: relative; }
.sw.off::after { content: ""; position: absolute; left: 20%; right: 20%; top: 50%; height: 2px; background: var(--muted); transform: rotate(-30deg); }
.buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
button.tg {
  font: 600 13px/1 var(--body); color: var(--fg);
  padding: 11px 4px; border-radius: 12px; cursor: pointer;
  background: rgba(255,255,255,0.06); border: 1px solid var(--line);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;
}
button.tg[aria-pressed="true"] { background: rgba(255,255,255,0.18); border-color: rgba(255,255,255,0.4); }
button.tg svg { width: 18px; height: 18px; flex: none; }
button:focus-visible, .sw:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.hint {
  position: fixed; z-index: 4; left: 50%; transform: translateX(-50%);
  top: calc(env(safe-area-inset-top, 0px) + 84px);
  font-size: 12px; color: var(--muted); padding: 6px 12px; border-radius: 99px;
  background: var(--panel); border: 1px solid var(--line); white-space: nowrap;
  transition: opacity .6s;
}
.hint.gone { opacity: 0; }
#loading {
  position: fixed; inset: 0; z-index: 10; display: grid; place-items: center;
  background: var(--bg); font-family: var(--display); letter-spacing: .1em; color: var(--muted);
  transition: opacity .5s;
}
#loading.done { opacity: 0; pointer-events: none; }
@media (prefers-reduced-motion: reduce) { .hint, #loading { transition: none; } }

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// ---------- room dimensions (from plan, room 2) ----------
// x: west (-) → east (+), z: north/balcony (-) → south/hallway (+)
const W = 3.0, L = 4.6, H = 2.7;
const hx = W / 2, hz = L / 2;

// ---------- renderer ----------
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
const DPR = Math.min(window.devicePixelRatio || 1, 1.75);
renderer.setPixelRatio(DPR);
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;

const portrait = () => innerWidth < innerHeight;
const camera = new THREE.PerspectiveCamera(portrait() ? 58 : 42, innerWidth / innerHeight, 0.03, 100);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.enablePan = false;
controls.rotateSpeed = 0.7;

// ---------- procedural textures ----------
const maxAniso = renderer.capabilities.getMaxAnisotropy();
function canvasTex(w, h, draw, { repeat, srgb = true } = {}) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = maxAniso;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  if (repeat) t.repeat.set(repeat[0], repeat[1]);
  return t;
}
const rnd = (a, b) => a + Math.random() * (b - a);
function noise(g, w, h, n, a0, a1, size = 2, light = true) {
  for (let i = 0; i < n; i++) { g.fillStyle = `rgba(${light ? '255,255,255' : '0,0,0'},${rnd(a0, a1)})`; g.fillRect(rnd(0, w), rnd(0, h), size, size); }
}

// oak floor planks running along the room
const floorTex = canvasTex(1024, 1024, (g, w, h) => {
  const cols = 8, cw = w / cols;
  for (let c = 0; c < cols; c++) {
    let y = -rnd(0, 600);
    while (y < h) {
      const len = rnd(520, 900);
      g.fillStyle = `hsl(${rnd(29, 34)},${rnd(34, 44)}%,${rnd(50, 60)}%)`;
      g.fillRect(c * cw, y, cw, len);
      for (let i = 0; i < 34; i++) {
        g.strokeStyle = `hsla(26,45%,${rnd(28, 40)}%,${rnd(0.06, 0.2)})`;
        g.lineWidth = rnd(0.6, 2.2);
        const x = c * cw + rnd(2, cw - 2);
        g.beginPath(); g.moveTo(x, y);
        g.bezierCurveTo(x + rnd(-8, 8), y + len * .33, x + rnd(-8, 8), y + len * .66, x + rnd(-3, 3), y + len);
        g.stroke();
      }
      if (Math.random() < .5) { g.fillStyle = 'hsla(25,40%,30%,.35)'; g.beginPath(); g.ellipse(c * cw + rnd(15, cw - 15), y + rnd(60, len - 60), rnd(4, 8), rnd(8, 14), 0, 0, Math.PI * 2); g.fill(); }
      g.fillStyle = 'rgba(40,24,12,0.55)'; g.fillRect(c * cw, y, cw, 2);
      y += len;
    }
    g.fillStyle = 'rgba(40,24,12,0.6)'; g.fillRect(c * cw, 0, 2, h);
  }
  noise(g, w, h, 20000, 0, 0.04);
}, { repeat: [W / 1.6, L / 1.6] });

// furniture veneer
function veneer(h0, s0, l0) {
  return canvasTex(512, 512, (g, w, h) => {
    g.fillStyle = `hsl(${h0},${s0}%,${l0}%)`; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 140; i++) {
      g.strokeStyle = `hsla(${h0 - 4},${s0 + 8}%,${l0 - rnd(8, 18)}%,${rnd(0.05, 0.18)})`;
      g.lineWidth = rnd(0.5, 2.5);
      const x = rnd(0, w);
      g.beginPath(); g.moveTo(x, 0);
      g.bezierCurveTo(x + rnd(-14, 14), h * .33, x + rnd(-14, 14), h * .66, x, h); g.stroke();
    }
    noise(g, w, h, 6000, 0, 0.05);
  });
}
const oakTex = veneer(33, 38, 62);
const walnutTex = veneer(24, 32, 32);

// greyscale bump maps
const plasterBump = canvasTex(512, 512, (g, w, h) => {
  g.fillStyle = '#808080'; g.fillRect(0, 0, w, h);
  noise(g, w, h, 30000, 0.02, 0.08, 3, true); noise(g, w, h, 30000, 0.02, 0.08, 3, false);
}, { srgb: false, repeat: [3, 2] });
const fabricBump = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#808080'; g.fillRect(0, 0, w, h);
  for (let y = 0; y < h; y += 4) { g.fillStyle = `rgba(0,0,0,${rnd(.1, .25)})`; g.fillRect(0, y, w, 1.5); }
  for (let x = 0; x < w; x += 4) { g.fillStyle = `rgba(255,255,255,${rnd(.08, .2)})`; g.fillRect(x, 0, 1.5, h); }
  noise(g, w, h, 5000, .05, .2, 2, false);
}, { srgb: false, repeat: [6, 6] });

// soft contact shadow blob
const blobTex = canvasTex(128, 128, (g, w, h) => {
  const r = g.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
  r.addColorStop(0, 'rgba(0,0,0,1)'); r.addColorStop(0.55, 'rgba(0,0,0,0.55)'); r.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = r; g.fillRect(0, 0, w, h);
});

const rugTex = canvasTex(1024, 768, (g, w, h) => {
  g.fillStyle = '#cfc6b6'; g.fillRect(0, 0, w, h);
  for (let y = 0; y < h; y += 3) { g.fillStyle = `rgba(90,75,60,${rnd(0.02, 0.09)})`; g.fillRect(0, y, w, 2); }
  noise(g, w, h, 40000, 0.02, 0.08, 2, false);
  g.strokeStyle = 'rgba(70,64,58,.55)'; g.lineWidth = 10; g.strokeRect(46, 46, w - 92, h - 92);
  g.strokeStyle = 'rgba(70,64,58,.35)'; g.lineWidth = 3; g.strokeRect(74, 74, w - 148, h - 148);
});

const gameScreen = canvasTex(1024, 576, (g, w, h) => {
  const sky = g.createLinearGradient(0, 0, 0, h * .65);
  sky.addColorStop(0, '#2b5c94'); sky.addColorStop(1, '#ffb07a');
  g.fillStyle = sky; g.fillRect(0, 0, w, h);
  g.fillStyle = '#ffe3a8'; g.beginPath(); g.arc(w * .68, h * .48, 56, 0, Math.PI * 2); g.fill();
  const layer = (col, base, amp, seed) => {
    g.fillStyle = col; g.beginPath(); g.moveTo(0, h);
    for (let x = 0; x <= w; x += 16) g.lineTo(x, base - Math.abs(Math.sin(x * 0.006 + seed) * amp + Math.sin(x * 0.021 + seed * 2) * amp * .35));
    g.lineTo(w, h); g.fill();
  };
  layer('#5f6e8c', h * .62, 120, 1); layer('#3b4a5e', h * .72, 90, 4); layer('#1f2a33', h * .86, 60, 7);
  g.strokeStyle = 'rgba(255,255,255,.9)'; g.lineWidth = 3;
  g.beginPath(); g.moveTo(w / 2 - 14, h / 2); g.lineTo(w / 2 - 4, h / 2); g.moveTo(w / 2 + 4, h / 2); g.lineTo(w / 2 + 14, h / 2);
  g.moveTo(w / 2, h / 2 - 14); g.lineTo(w / 2, h / 2 - 4); g.moveTo(w / 2, h / 2 + 4); g.lineTo(w / 2, h / 2 + 14); g.stroke();
  g.fillStyle = 'rgba(0,0,0,.45)'; g.fillRect(28, h - 60, 260, 28);
  g.fillStyle = '#39ff88'; g.fillRect(32, h - 56, 190, 20);
  g.fillStyle = '#fff'; g.font = '600 34px sans-serif'; g.fillText('30 / 90', w - 200, h - 32);
});
const tvScreen = canvasTex(1024, 576, (g, w, h) => {
  const sky = g.createLinearGradient(0, 0, 0, h);
  sky.addColorStop(0, '#0e3b5c'); sky.addColorStop(.6, '#3d8fb8'); sky.addColorStop(1, '#0a2333');
  g.fillStyle = sky; g.fillRect(0, 0, w, h);
  g.fillStyle = '#2f6b45'; g.beginPath(); g.moveTo(0, h * .7);
  for (let x = 0; x <= w; x += 8) g.lineTo(x, h * .7 + Math.sin(x * .01) * 10); g.lineTo(w, h); g.lineTo(0, h); g.fill();
  g.strokeStyle = 'rgba(255,255,255,.7)'; g.lineWidth = 4; g.beginPath(); g.moveTo(w * .5, h * .7); g.lineTo(w * .5, h); g.stroke();
  g.beginPath(); g.ellipse(w * .5, h * .85, 90, 30, 0, 0, Math.PI * 2); g.stroke();
  g.fillStyle = 'rgba(0,0,0,.55)'; g.fillRect(40, 36, 250, 44);
  g.fillStyle = '#fff'; g.font = '600 28px sans-serif'; g.fillText('POL  2 : 1  ESP', 56, 68);
});
const darkScreen = canvasTex(64, 36, (g, w, h) => { g.fillStyle = '#000'; g.fillRect(0, 0, w, h); });

function artTex(kind) {
  return canvasTex(512, 700, (g, w, h) => {
    if (kind === 0) {
      const s = g.createLinearGradient(0, 0, 0, h); s.addColorStop(0, '#e9d9c4'); s.addColorStop(1, '#d4b896');
      g.fillStyle = s; g.fillRect(0, 0, w, h);
      g.fillStyle = '#c4664a'; g.beginPath(); g.arc(w * .62, h * .32, 80, 0, Math.PI * 2); g.fill();
      g.fillStyle = '#5c6b73'; g.beginPath(); g.moveTo(0, h * .7); g.lineTo(w * .35, h * .42); g.lineTo(w * .7, h * .66); g.lineTo(w, h * .5); g.lineTo(w, h); g.lineTo(0, h); g.fill();
      g.fillStyle = '#2f3b40'; g.beginPath(); g.moveTo(0, h * .82); g.lineTo(w * .5, h * .6); g.lineTo(w, h * .8); g.lineTo(w, h); g.lineTo(0, h); g.fill();
    } else {
      g.fillStyle = '#efece6'; g.fillRect(0, 0, w, h);
      g.strokeStyle = '#1f2328'; g.lineWidth = 3;
      for (let i = 0; i < 26; i++) { g.beginPath(); g.moveTo(80, 120 + i * 18); g.bezierCurveTo(200, 80 + i * 18 + Math.sin(i) * 40, 320, 160 + i * 18, 432, 120 + i * 18); g.stroke(); }
      g.fillStyle = '#1f2328'; g.font = '600 30px sans-serif'; g.textAlign = 'center'; g.fillText('LEVEL UP', w / 2, h - 80);
    }
    noise(g, w, h, 8000, 0, 0.05, 2, false);
  });
}

function skyTex(day) {
  return canvasTex(1024, 512, (g, w, h) => {
    const s = g.createLinearGradient(0, 0, 0, h);
    if (day) { s.addColorStop(0, '#6fa8e8'); s.addColorStop(.75, '#d8ecff'); }
    else { s.addColorStop(0, '#04060d'); s.addColorStop(.75, '#1a2242'); }
    g.fillStyle = s; g.fillRect(0, 0, w, h);
    if (!day) for (let i = 0; i < 160; i++) { g.fillStyle = `rgba(255,255,255,${rnd(.2, .9)})`; g.fillRect(rnd(0, w), rnd(0, h * .55), 1.5, 1.5); }
    let x = 0;
    while (x < w) {
      const bw = rnd(40, 110), bh = rnd(80, 230);
      g.fillStyle = day ? `hsl(215,12%,${rnd(66, 78)}%)` : `hsl(225,25%,${rnd(7, 12)}%)`;
      g.fillRect(x, h - bh, bw, bh);
      for (let yy = h - bh + 8; yy < h - 8; yy += 14) for (let xx = x + 6; xx < x + bw - 6; xx += 12)
        if (Math.random() < (day ? .5 : .35)) { g.fillStyle = day ? 'rgba(90,110,130,.35)' : `rgba(255,${rnd(190, 230)},120,${rnd(.5, .95)})`; g.fillRect(xx, yy, 5, 7); }
      x += bw + rnd(4, 20);
    }
    g.fillStyle = day ? '#5b7a4a' : '#0b120c';
    for (let i = 0; i < 26; i++) { g.beginPath(); g.arc(rnd(0, w), h - rnd(0, 20), rnd(24, 56), 0, Math.PI * 2); g.fill(); }
  });
}
const skyDay = skyTex(true), skyNight = skyTex(false);

// ---------- materials ----------
const M = (color, roughness = 0.7, metalness = 0, extra = {}) => new THREE.MeshStandardMaterial({ color, roughness, metalness, ...extra });
const fabric = (color, extra = {}) => new THREE.MeshPhysicalMaterial({ color, roughness: 0.92, sheen: 1, sheenRoughness: 0.7, sheenColor: 0xffffff, bumpMap: fabricBump, bumpScale: 0.4, ...extra });
const floorMat = M(0xffffff, 0.45, 0, { map: floorTex });
const wallMat = M(0xe9e5de, 0.95, 0, { bumpMap: plasterBump, bumpScale: 0.25 });
const accentMat = M(0x3c4148, 0.95, 0, { bumpMap: plasterBump, bumpScale: 0.25 });  // graphite TV/desk wall
const ceilMat = M(0xf3f2ef, 0.95);
const capMat = M(0x8c8f96, 0.85);
const blackMat = M(0x1a1c20, 0.45, 0.15);
const metalMat = M(0x2a2c31, 0.35, 0.8);
const chromeMat = M(0xcfd2d6, 0.2, 1);
const whiteMat = M(0xf1f0ec, 0.55);
const frontMat = M(0xeeede8, 0.5);
const oakMat = M(0xffffff, 0.55, 0, { map: oakTex });
const walnutMat = M(0xffffff, 0.5, 0, { map: walnutTex });
const anthracite = M(0x33363b, 0.45, 0.3);
const glassMat = new THREE.MeshPhysicalMaterial({ color: 0xdfeaf3, roughness: 0.03, metalness: 0, transparent: true, opacity: 0.12, envMapIntensity: 1.5 });
const tintGlass = new THREE.MeshPhysicalMaterial({ color: 0x222831, roughness: 0.08, metalness: 0.1, transparent: true, opacity: 0.4 });
const leafMat = M(0x2f6b3a, 0.65, 0, { side: THREE.DoubleSide });
const shadowMat = new THREE.MeshBasicMaterial({ map: blobTex, transparent: true, depthWrite: false, opacity: 0.55, color: 0x000000 });

const ledMats = [];
const ledMat = (base = 3) => { const m = new THREE.MeshStandardMaterial({ color: 0x000000, emissive: 0x00d4ff, emissiveIntensity: base, roughness: 1 }); m.userData.base = base; ledMats.push(m); return m; };

// ---------- helpers ----------
function box(w, h, d, mat, x, y, z, { r = 0, parent = scene, cast = true } = {}) {
  const geo = r > 0 ? new RoundedBoxGeometry(w, h, d, 3, r) : new THREE.BoxGeometry(w, h, d);
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z); m.castShadow = cast; m.receiveShadow = true;
  parent.add(m); return m;
}
function plane(w, h, mat, x, y, z, ry = 0, { parent = scene, cast = false } = {}) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
  m.position.set(x, y, z); m.rotation.y = ry; m.receiveShadow = true; m.castShadow = cast;
  parent.add(m); return m;
}
function cyl(rt, rb, h, mat, x, y, z, { parent = scene, seg = 24 } = {}) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat);

}
function contact(x, z, w, d, op = 0.55, y = 0.004) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d), shadowMat.clone());

}

function curtain(x, width, gathered) {
  const geo = new THREE.PlaneGeometry(width, 2.4, 60, 12);
  const p = geo.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const u = p.getX(i), v = p.getY(i);
    const fold = gathered ? 0.035 : 0.022;
    p.setZ(i, Math.sin(u * (gathered ? 55 : 38)) * fold * (1 + (1.2 - v) * 0.15) + Math.sin(u * 9 + v) * 0.006);
  }
  geo.computeVertexNormals();
  const m = new THREE.Mesh(geo, fabric(0xd8d0c2, { side: THREE.DoubleSide, bumpScale: 0.2 }));
  m.position.set(x, 1.23, -hz + 0.1); m.castShadow = true; m.receiveShadow = true; scene.add(m);
}

    g.fillRect(c * kw + 5, r * kh + 5, kw - 10, kh - 10);

    while (z < 0.2) { const th = rnd(0.02, 0.05), bh = rnd(0.2, 0.31); box(0.2, bh, th, M(bookCols[Math.floor(rnd(0, 7))], 0.85), 0, 0.03 + s * 0.37 + bh / 2 + 0.01, z + th / 2, { parent: g }); z += th + 0.004; if (Math.random() < 0.08) z += 0.08; }
  }

// ---------- bed (east wall, head at south) ----------
const BX = 0.78, BZ = 1.22;
{
  const g = new THREE.Group(); g.position.set(BX, 0, BZ); scene.add(g);
  const up = fabric(0x8e9196);
  box(1.46, 0.3, 2.1, up, 0, 0.19, 0, { parent: g, r: 0.035 });
  for (const [x, z] of [[-0.66, -0.98], [0.66, -0.98], [-0.66, 0.98], [0.66, 0.98]]) cyl(0.02, 0.02, 0.05, oakMat, x, 0.025, z, { parent: g, seg: 10 });
  box(1.38, 0.2, 2.0, fabric(0xf5f4f1, { bumpScale: 0.15 }), 0, 0.44, -0.02, { parent: g, r: 0.06 });
  // duvet: soft wavy top
  const dGeo = new RoundedBoxGeometry(1.48, 0.1, 1.42, 4, 0.045);
  const dp = dGeo.attributes.position;
  for (let i = 0; i < dp.count; i++) if (dp.getY(i) > 0) dp.setY(i, dp.getY(i) + Math.sin(dp.getX(i) * 6) * 0.008 + Math.sin(dp.getZ(i) * 5) * 0.01);
  dGeo.computeVertexNormals();
  const duvet = new THREE.Mesh(dGeo, fabric(0xbfc4cb)); duvet.position.set(0, 0.575, -0.28); duvet.castShadow = duvet.receiveShadow = true; g.add(duvet);

  for (const x of [-0.34, 0.34]) { const p = box(0.58, 0.14, 0.34, fabric(0xf5f4f1, { bumpScale: 0.15 }), x, 0.6, 0.78, { parent: g, r: 0.065 }); p.rotation.x = -0.25; p.position.y = 0.62; }
  box(0.4, 0.12, 0.13, fabric(0x4b5a6e), -0.12, 0.66, 0.6, { parent: g, r: 0.05 }).rotation.set(-0.3, 0.1, 0);

// nightstand + lamp (beside the headboard)
{

// ---------- east wall: art, reading corner, plant ----------
const eastDecor = new THREE.Group(); scene.add(eastDecor);   // hidden when the camera looks in through the east wall
const art = (tex, z, w, h, y) => {

};

art(artTex(1), -0.95, 0.42, 0.58, 1.55);
// bean bag
const beanGeo = new THREE.SphereGeometry(0.4, 40, 24);
{ const p = beanGeo.attributes.position; for (let i = 0; i < p.count; i++) { const y = p.getY(i); p.setY(i, y < 0 ? y * 0.5 : y * 0.62 + Math.sin(p.getX(i) * 9) * 0.01); } beanGeo.computeVertexNormals(); }
const bean = new THREE.Mesh(beanGeo, fabric(0x56616b)); bean.position.set(1.0, 0.2, -0.75); bean.castShadow = bean.receiveShadow = true; scene.add(bean);
contact(1.0, -0.75, 1.0, 1.0, 0.55);
// arc floor lamp
{
  cyl(0.14, 0.15, 0.025, blackMat, 1.32, 0.013, -1.3);

  const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.04, 16, 10), M(0x000000, 1, 0, { emissive: 0xffd2a0, emissiveIntensity: 0 }));

// big plant by the radiator corner
{

    const stem = cyl(0.005, 0.007, y - 0.35, M(0x3d5a2e, 0.8), px + Math.cos(a) * r * 0.5, (y + 0.35) / 2, pz + Math.sin(a) * r * 0.5, { seg: 5 });
  }

// rug between TV and bed
const rug = new THREE.Mesh(new THREE.PlaneGeometry(2.0, 1.5), M(0xffffff, 1, 0, { map: rugTex, bumpMap: fabricBump, bumpScale: 0.6 }));
rug.rotation.x = -Math.PI / 2; rug.position.set(0.0, 0.006, 0.55); rug.receiveShadow = true; scene.add(rug);

// ---------- ceiling: flush lamp + LED strip (LED from the plan) ----------
const lampMat = M(0xf7f5f0, 0.4, 0, { emissive: 0xffe6c4, emissiveIntensity: 0 });
const ceilLamp = cyl(0.25, 0.25, 0.045, lampMat, 0, H - 0.023, 0, { seg: 48 });
ceilLamp.castShadow = false;
const ci = 0.05, cy = H - 0.03;
box(W - 2 * ci, 0.012, 0.012, ledMat(2.4), 0, cy, -hz + ci, { cast: false });
box(W - 2 * ci, 0.012, 0.012, ledMat(2.4), 0, cy, hz - ci, { cast: false });
box(0.012, 0.012, L - 2 * ci, ledMat(2.4), -hx + ci, cy, 0, { cast: false });
box(0.012, 0.012, L - 2 * ci, ledMat(2.4), hx - ci, cy, 0, { cast: false });

// ---------- lights ----------
const hemi = new THREE.HemisphereLight(0xdfe9ff, 0x6b5a48, 1); scene.add(hemi);

const sun = new THREE.DirectionalLight(0xfff0da, 3);
sun.position.set(2.2, 4.2, -7); sun.target.position.set(-0.2, 0, 0.3);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -4, right: 4, top: 4, bottom: -4, near: 1, far: 20 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02; sun.shadow.radius = 4;
scene.add(sun, sun.target);
// soft daylight spilling in from the balcony
const skyFill = new THREE.SpotLight(0xcfe0ff, 0, 9, 1.1, 1, 1.5);
skyFill.position.set(0.15, 1.9, -hz - 0.6); skyFill.target.position.set(0.0, 0.6, 1.2); scene.add(skyFill, skyFill.target);

const spot = new THREE.SpotLight(0xffe2bd, 0, 9, 1.3, 0.8, 2);
spot.position.set(0, H - 0.06, 0); spot.target.position.set(0, 0, 0);
spot.castShadow = true; spot.shadow.mapSize.set(1024, 1024); spot.shadow.bias = -0.0004; spot.shadow.normalBias = 0.02;
scene.add(spot, spot.target);

const ledLights = [];
for (const [x, z] of [[-1.1, -1.7], [1.1, -1.7], [-1.1, 1.7], [1.1, 1.7], [0, 0]]) {
  const p = new THREE.PointLight(0x00d4ff, 1, 4.5, 2); p.position.set(x, H - 0.25, z); p.userData.base = 1; scene.add(p); ledLights.push(p);
}
const tvGlow = new THREE.PointLight(0x00d4ff, 1, 1.8, 2); tvGlow.position.set(-hx + 0.12, 1.5, KZ); tvGlow.userData.base = 0.9; scene.add(tvGlow); ledLights.push(tvGlow);
const tvLight = new THREE.PointLight(0x9cc6ff, 0, 3.2, 2); tvLight.position.set(-hx + 0.6, 1.4, KZ); scene.add(tvLight);
const screenLight = new THREE.PointLight(0xa8c0ff, 0.7, 2.2, 2); screenLight.position.set(-1.05, 1.1, DZ); scene.add(screenLight);
const bedLamp = new THREE.PointLight(0xffb866, 0, 3, 2); bedLamp.position.set(-0.11, 0.78, 2.08); scene.add(bedLamp);
const arcLamp = new THREE.PointLight(0xffc58a, 0, 3.5, 2); arcLamp.position.set(0.74, 1.7, -1.3); scene.add(arcLamp);
const deskLamp = new THREE.SpotLight(0xffe0b0, 0, 2.5, 0.9, 0.7, 2); deskLamp.position.set(-1.08, 1.07, DZ + 0.47); deskLamp.target.position.set(-1.05, 0.7, DZ + 0.3); scene.add(deskLamp, deskLamp.target);

// ---------- post-processing ----------
const composer = new EffectComposer(renderer);
composer.setPixelRatio(DPR);
composer.setSize(innerWidth, innerHeight);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth / 2, innerHeight / 2), 0.5, 0.5, 0.9);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// ---------- state ----------
const state = { color: '#00d4ff', rainbow: false, ledOn: true, night: false, lamp: false, tv: false, inside: false };
const tmpColor = new THREE.Color();
function setLedColor(c) {
  tmpColor.set(c);
  ledMats.forEach(m => m.emissive.copy(tmpColor));
  ledLights.forEach(l => l.color.copy(tmpColor));
}
function applyLighting() {
  const { night, lamp, ledOn, tv } = state;
  const day = !night;
  ledMats.forEach(m => m.emissiveIntensity = ledOn ? m.userData.base * (day ? 0.45 : 0.8) : 0);
  ledLights.forEach(l => l.intensity = ledOn ? l.userData.base * (day ? 0.25 : 1.3) : 0);
  hemi.intensity = day ? 0.9 : 0.05;
  sun.intensity = day ? 3.2 : 0; sun.castShadow = day;
  skyFill.intensity = day ? 6 : 0;
  spot.intensity = lamp ? (day ? 8 : 16) : 0; spot.castShadow = lamp;
  lampMat.emissiveIntensity = lamp ? 2.2 : 0;
  const cozy = night && !lamp;
  bedLamp.intensity = cozy ? 0.9 : 0; scene.userData.bedShade.material.emissiveIntensity = cozy ? 0.45 : 0;
  arcLamp.intensity = cozy ? 1.4 : 0; scene.userData.arcBulb.material.emissiveIntensity = cozy ? 2 : 0;
  deskLamp.intensity = night ? 1.2 : 0; deskBulb.material.emissiveIntensity = night ? 3 : 0;
  tvMat.emissiveMap = tv ? tvScreen : darkScreen; tvMat.emissiveIntensity = tv ? 1.0 : 1; tvMat.needsUpdate = true;
  tvLight.intensity = tv ? (day ? 0.3 : 1.4) : 0;
  screenLight.intensity = day ? 0.15 : 0.7;
  bloom.strength = day ? 0.18 : 0.6;
  bloom.threshold = day ? 0.97 : 0.85;
  renderer.toneMappingExposure = day ? 0.9 : 1.2;
  scene.background = new THREE.Color(day ? 0xb7c6d6 : 0x07090e);
  ground.material.color.set(day ? 0x7c8a6a : 0x0c0e13);
  backdrop.material.map = day ? skyDay : skyNight; backdrop.material.needsUpdate = true;
  scene.traverse(o => { if (o.isMesh && o.material && 'envMapIntensity' in o.material && o.material !== glassMat) o.material.envMapIntensity = day ? 0.55 : 0.08; });
}
setLedColor(state.color);
applyLighting();

// ---------- views ----------
const views = {
  outside: { pos: new THREE.Vector3(4.6, 6.2, 6.4), target: new THREE.Vector3(0, 0.9, 0), min: 3.2, max: 12, polar: Math.PI * 0.47, fovP: 58, fovL: 42 },
  inside: { pos: new THREE.Vector3(0.75, 1.55, -1.25), target: new THREE.Vector3(0.0, 1.25, 0.05), min: 0.05, max: 1.3, polar: Math.PI * 0.85, fovP: 80, fovL: 64 }
};
if (portrait()) views.outside.pos.set(5.4, 7.2, 7.6);
camera.position.copy(views.outside.pos);
controls.target.copy(views.outside.target);
controls.minDistance = views.outside.min; controls.maxDistance = views.outside.max; controls.maxPolarAngle = views.outside.polar;

let tween = null;
function goTo(name) {
  const v = views[name];
  controls.minDistance = 0.01; controls.maxDistance = 100;
  tween = { t: 0, fromPos: camera.position.clone(), fromTarget: controls.target.clone(), fromFov: camera.fov, v };
  controls.maxPolarAngle = v.polar;
  backdrop.visible = name === 'inside';
}
const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

// ---------- UI ----------
const swatches = document.querySelectorAll('.sw');
swatches.forEach(b => b.addEventListener('click', () => {
  swatches.forEach(s => s.setAttribute('aria-pressed', String(s === b)));
  const c = b.dataset.c;
  state.rainbow = c === 'rainbow';
  state.ledOn = c !== 'off';
  if (state.ledOn && !state.rainbow) { state.color = c; setLedColor(c); document.documentElement.style.setProperty('--accent', c); }
  applyLighting();
}));
const toggle = (id, key, after) => {
  const b = document.getElementById(id);
  b.addEventListener('click', () => { state[key] = !state[key]; b.setAttribute('aria-pressed', String(state[key])); after && after(b); applyLighting(); });
};
toggle('btnLamp', 'lamp');
toggle('btnTv', 'tv');
toggle('btnDay', 'night', b => b.querySelector('span').textContent = state.night ? 'Dzień' : 'Noc');
toggle('btnView', 'inside', b => { b.querySelector('span').textContent = state.inside ? 'Z góry' : 'W środku'; goTo(state.inside ? 'inside' : 'outside'); });
const hint = document.getElementById('hint');
controls.addEventListener('start', () => hint.classList.add('gone'), { once: true });
setTimeout(() => hint.classList.add('gone'), 7000);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  const v = state.inside ? views.inside : views.outside;
  camera.fov = portrait() ? v.fovP : v.fovL;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  bloom.resolution.set(innerWidth / 2, innerHeight / 2);
});

// ---------- loop ----------
const clock = new THREE.Clock();
let first = true;
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  if (tween) {
    tween.t = Math.min(1, tween.t + dt / 1.1);
    const k = ease(tween.t), v = tween.v;
    camera.position.lerpVectors(tween.fromPos, v.pos, k);
    controls.target.lerpVectors(tween.fromTarget, v.target, k);
    camera.fov = THREE.MathUtils.lerp(tween.fromFov, portrait() ? v.fovP : v.fovL, k);
    camera.updateProjectionMatrix();
    if (tween.t >= 1) { controls.minDistance = v.min; controls.maxDistance = v.max; tween = null; }
  }
  if (state.rainbow && state.ledOn) setLedColor('#' + tmpColor.setHSL((t * 0.06) % 1, 1, 0.55).getHexString());
  if (state.tv) tvLight.intensity = (state.night ? 1.4 : 0.3) * (0.85 + Math.sin(t * 2.3) * 0.08 + Math.sin(t * 5.7) * 0.07);
  controls.update();
  eastDecor.visible = camera.position.x < hx + 0.1;
  westDecor.visible = camera.position.x > -hx - 0.1;
  doorLeaf.visible = camera.position.z < hz + 0.1;
  composer.render();
  if (first) { first = false; document.getElementById('loading').classList.add('done'); }
});
</script>

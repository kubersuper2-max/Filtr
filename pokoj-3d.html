<style>
/* Layout: full-screen 3D stage, glass HUD pinned to top-left and bottom edge */
:root {
  --bg: #07090e;
  --panel: rgba(16, 19, 27, 0.72);
  --line: rgba(160, 176, 204, 0.16);
  --fg: #e7ebf3;
  --muted: #8b94a7;
  --accent: #00d4ff;
  --display: "Chakra Petch", "Inter", system-ui, sans-serif;
  --body: "Inter", system-ui, -apple-system, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; overflow: hidden; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); -webkit-user-select: none; user-select: none; }
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }

.tag {
  position: fixed; z-index: 5;
  top: calc(env(safe-area-inset-top, 0px) + 12px);
  left: max(16px, env(safe-area-inset-left, 0px));
  padding: 10px 14px; border-radius: 14px;
  background: var(--panel); border: 1px solid var(--line);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
}
.tag .name { font-family: var(--display); font-weight: 600; font-size: 18px; letter-spacing: 0.02em; display: flex; align-items: center; gap: 8px; }
.tag .num { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--fg); font-size: 12px; }
.tag .dims { color: var(--muted); font-size: 12px; margin-top: 2px; font-variant-numeric: tabular-nums; }

.hud {
  position: fixed; z-index: 5; left: 0; right: 0; bottom: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(env(safe-area-inset-bottom, 0px) + 14px);
  display: flex; justify-content: center; pointer-events: none;
}
.dock {
  pointer-events: auto; width: 100%; max-width: 460px;
  display: flex; flex-direction: column; gap: 10px;
  padding: 12px; border-radius: 20px;
  background: var(--panel); border: 1px solid var(--line);
  -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
}
.label { font-family: var(--display); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.swatches { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.sw {
  flex: 1; height: 34px; border-radius: 10px; border: 2px solid transparent; cursor: pointer;
  background: var(--c); box-shadow: 0 0 14px -4px var(--c);
}
.sw[aria-pressed="true"] { border-color: var(--fg); }
.sw.rainbow { background: linear-gradient(90deg, #ff3b6b, #ffb23b, #3bff9d, #3bc8ff, #a35bff); --c: #a35bff; }
.sw.off { background: #1b1f28; --c: transparent; position: relative; }
.sw.off::after { content: ""; position: absolute; left: 20%; right: 20%; top: 50%; height: 2px; background: var(--muted); transform: rotate(-30deg); }
.buttons { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
button.tg {
  font: 600 14px/1 var(--body); color: var(--fg);
  padding: 12px 6px; border-radius: 12px; cursor: pointer;
  background: rgba(255,255,255,0.06); border: 1px solid var(--line);
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
button.tg[aria-pressed="true"] { background: rgba(255,255,255,0.16); border-color: rgba(255,255,255,0.35); }
button.tg svg { width: 16px; height: 16px; flex: none; }
button:focus-visible, .sw:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.hint {
  position: fixed; z-index: 4; left: 50%; transform: translateX(-50%);
  top: calc(env(safe-area-inset-top, 0px) + 84px);
  font-size: 12px; color: var(--muted); padding: 6px 12px; border-radius: 99px;
  background: var(--panel); border: 1px solid var(--line); white-space: nowrap;
  transition: opacity .6s;
}
.hint.gone { opacity: 0; }
#loading {
  position: fixed; inset: 0; z-index: 10; display: grid; place-items: center;
  background: var(--bg); font-family: var(--display); letter-spacing: .1em; color: var(--muted);
  transition: opacity .5s;
}
#loading.done { opacity: 0; pointer-events: none; }
@media (prefers-reduced-motion: reduce) { .hint, #loading { transition: none; } }
</style>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// ---------- room dimensions (from plan, room 2) ----------
const W = 3.0, L = 4.6, H = 2.7;
const hx = W / 2, hz = L / 2;

// ---------- renderer ----------
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
const DPR = Math.min(window.devicePixelRatio || 1, 1.75);
renderer.setPixelRatio(DPR);
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;

const camera = new THREE.PerspectiveCamera(innerWidth < innerHeight ? 58 : 42, innerWidth / innerHeight, 0.03, 100);
camera.position.set(4.6, 6.2, 6.4);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.9, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.enablePan = false;
controls.rotateSpeed = 0.7;
controls.minDistance = 3.2;
controls.maxDistance = 12;
controls.maxPolarAngle = Math.PI * 0.47;

// ---------- canvas textures ----------
const maxAniso = renderer.capabilities.getMaxAnisotropy();
function canvasTex(w, h, draw, { repeat, srgb = true } = {}) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = maxAniso;
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat[0], repeat[1]); }
  return t;
}
const rnd = (a, b) => a + Math.random() * (b - a);

const woodTex = canvasTex(1024, 1024, (g, w, h) => {
  const cols = 10, cw = w / cols;
  for (let c = 0; c < cols; c++) {
    let y = -rnd(0, 500);
    while (y < h) {
      const len = rnd(420, 760);
      const l = rnd(27, 36), s = rnd(28, 38);
      g.fillStyle = `hsl(${rnd(24, 30)},${s}%,${l}%)`;
      g.fillRect(c * cw, y, cw, len);
      for (let i = 0; i < 26; i++) {
        g.strokeStyle = `hsla(25,40%,${rnd(12, 22)}%,${rnd(0.08, 0.22)})`;
        g.lineWidth = rnd(0.6, 2);
        const x = c * cw + rnd(2, cw - 2);
        g.beginPath(); g.moveTo(x, y);
        g.bezierCurveTo(x + rnd(-6, 6), y + len * .33, x + rnd(-6, 6), y + len * .66, x + rnd(-3, 3), y + len);
        g.stroke();
      }
      g.fillStyle = 'rgba(10,6,3,0.7)'; g.fillRect(c * cw, y, cw, 2);
      y += len;
    }
    g.fillStyle = 'rgba(10,6,3,0.75)'; g.fillRect(c * cw, 0, 2, h);
  }
}, { repeat: [W / 2, L / 2] });

const rugTex = canvasTex(512, 512, (g, w, h) => {
  g.fillStyle = '#1c2029'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 9000; i++) { g.fillStyle = `rgba(255,255,255,${rnd(0, 0.035)})`; g.fillRect(rnd(0, w), rnd(0, h), 2, 2); }
  g.strokeStyle = '#2d3340'; g.lineWidth = 18; g.beginPath(); g.arc(w / 2, h / 2, w * 0.42, 0, Math.PI * 2); g.stroke();
  g.strokeStyle = '#4a5466'; g.lineWidth = 3; g.beginPath(); g.arc(w / 2, h / 2, w * 0.36, 0, Math.PI * 2); g.stroke();
  g.strokeStyle = '#2a303c'; g.lineWidth = 2;
  for (let r = 40; r < w * 0.33; r += 22) { g.beginPath(); g.arc(w / 2, h / 2, r, 0, Math.PI * 2); g.stroke(); }
});

const gameScreen = canvasTex(1024, 576, (g, w, h) => {
  const sky = g.createLinearGradient(0, 0, 0, h * .65);
  sky.addColorStop(0, '#0b1e3a'); sky.addColorStop(1, '#ff7a59');
  g.fillStyle = sky; g.fillRect(0, 0, w, h);
  g.fillStyle = '#ffd38a'; g.beginPath(); g.arc(w * .68, h * .5, 60, 0, Math.PI * 2); g.fill();
  const layer = (col, base, amp, seed) => {
    g.fillStyle = col; g.beginPath(); g.moveTo(0, h);
    for (let x = 0; x <= w; x += 16) g.lineTo(x, base - Math.abs(Math.sin(x * 0.006 + seed) * amp + Math.sin(x * 0.021 + seed * 2) * amp * .35));
    g.lineTo(w, h); g.fill();
  };
  layer('#3a2a52', h * .62, 120, 1); layer('#231a36', h * .72, 90, 4); layer('#120e1e', h * .86, 60, 7);
  g.strokeStyle = 'rgba(255,255,255,.9)'; g.lineWidth = 3;
  g.beginPath(); g.moveTo(w / 2 - 14, h / 2); g.lineTo(w / 2 - 4, h / 2); g.moveTo(w / 2 + 4, h / 2); g.lineTo(w / 2 + 14, h / 2);
  g.moveTo(w / 2, h / 2 - 14); g.lineTo(w / 2, h / 2 - 4); g.moveTo(w / 2, h / 2 + 4); g.lineTo(w / 2, h / 2 + 14); g.stroke();
  g.fillStyle = 'rgba(0,0,0,.45)'; g.fillRect(28, h - 60, 260, 28);
  g.fillStyle = '#39ff88'; g.fillRect(32, h - 56, 190, 20);
  g.fillStyle = 'rgba(0,0,0,.45)'; g.fillRect(w - 170, 24, 146, 146);
  g.strokeStyle = 'rgba(255,255,255,.5)'; g.lineWidth = 2; g.strokeRect(w - 170, 24, 146, 146);
  g.fillStyle = '#ff3b6b'; g.beginPath(); g.arc(w - 97, 97, 6, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#fff'; g.font = '600 34px sans-serif'; g.fillText('30 / 90', w - 200, h - 32);
});

const chatScreen = canvasTex(576, 1024, (g, w, h) => {
  g.fillStyle = '#1e2129'; g.fillRect(0, 0, w, h);
  g.fillStyle = '#16181e'; g.fillRect(0, 0, 70, h);
  for (let i = 0; i < 9; i++) { g.fillStyle = ['#5865f2', '#3ba55d', '#eb459e', '#faa61a', '#2f3136'][i % 5]; g.beginPath(); g.arc(35, 50 + i * 72, 24, 0, Math.PI * 2); g.fill(); }
  let y = 60;
  while (y < h - 120) {
    g.fillStyle = ['#7289da', '#43b581', '#f04747', '#faa61a'][Math.floor(rnd(0, 4))];
    g.beginPath(); g.arc(110, y + 14, 18, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#c9cdd6'; g.fillRect(140, y, rnd(80, 160), 14);
    const lines = Math.floor(rnd(1, 4));
    for (let i = 0; i < lines; i++) { g.fillStyle = '#7c818d'; g.fillRect(140, y + 26 + i * 22, rnd(180, 400), 12); }
    y += 50 + lines * 22;
  }
  g.fillStyle = '#2c2f38'; g.fillRect(90, h - 80, w - 110, 52);
});

function posterTex(kind) {
  return canvasTex(512, 720, (g, w, h) => {
    if (kind === 0) {
      const bg = g.createLinearGradient(0, 0, 0, h);
      bg.addColorStop(0, '#0d0a24'); bg.addColorStop(.55, '#3b1460'); bg.addColorStop(.56, '#09061a'); bg.addColorStop(1, '#09061a');
      g.fillStyle = bg; g.fillRect(0, 0, w, h);
      const sun = g.createLinearGradient(0, 150, 0, 400);
      sun.addColorStop(0, '#ffd36b'); sun.addColorStop(1, '#ff3d7f');
      g.fillStyle = sun; g.beginPath(); g.arc(w / 2, 300, 120, 0, Math.PI * 2); g.fill();
      g.fillStyle = '#3b1460';
      for (let i = 0; i < 6; i++) g.fillRect(0, 300 + i * 18, w, 4 + i * 1.6);
      g.strokeStyle = '#d33cff'; g.lineWidth = 2;
      for (let i = 0; i < 9; i++) { const yy = 405 + Math.pow(i, 1.7) * 6; g.beginPath(); g.moveTo(0, yy); g.lineTo(w, yy); g.stroke(); }
      for (let i = -10; i <= 10; i++) { g.beginPath(); g.moveTo(w / 2 + i * 8, 400); g.lineTo(w / 2 + i * 70, h); g.stroke(); }
      g.fillStyle = '#e8e6ff'; g.font = '600 46px sans-serif'; g.textAlign = 'center'; g.fillText('PLAYER 2', w / 2, 90);
    } else {
      g.fillStyle = '#0f1218'; g.fillRect(0, 0, w, h);
      g.strokeStyle = '#00d4ff'; g.lineWidth = 6;
      for (let i = 0; i < 5; i++) { g.globalAlpha = 1 - i * .17; g.strokeRect(70 + i * 30, 130 + i * 30, w - 140 - i * 60, w - 140 - i * 60); }
      g.globalAlpha = 1;
      g.fillStyle = '#e7ebf3'; g.font = '700 120px sans-serif'; g.textAlign = 'center'; g.fillText('GG', w / 2, 600);
      g.fillStyle = '#8b94a7'; g.font = '500 22px sans-serif'; g.fillText('GOOD GAME · WELL PLAYED', w / 2, 650);
    }
  });
}

const keysTex = canvasTex(512, 150, (g, w, h) => {
  g.fillStyle = '#000'; g.fillRect(0, 0, w, h);
  g.fillStyle = '#fff';
  const rows = 5, cols = 15, kw = w / cols, kh = h / rows;
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    if (r === 4 && c > 3 && c < 10) { if (c === 4) g.fillRect(4 * kw + 5, r * kh + 5, 6 * kw - 10, kh - 10); continue; }
    g.fillRect(c * kw + 5, r * kh + 5, kw - 10, kh - 10);
  }
});

function skyTex(day) {
  return canvasTex(1024, 512, (g, w, h) => {
    const s = g.createLinearGradient(0, 0, 0, h);
    if (day) { s.addColorStop(0, '#6fa8e8'); s.addColorStop(.75, '#d8ecff'); }
    else { s.addColorStop(0, '#04060d'); s.addColorStop(.75, '#1a2242'); }
    g.fillStyle = s; g.fillRect(0, 0, w, h);
    if (!day) for (let i = 0; i < 160; i++) { g.fillStyle = `rgba(255,255,255,${rnd(.2, .9)})`; g.fillRect(rnd(0, w), rnd(0, h * .55), 1.5, 1.5); }
    let x = 0;
    while (x < w) {
      const bw = rnd(40, 110), bh = rnd(80, 230);
      g.fillStyle = day ? `hsl(215,12%,${rnd(66, 78)}%)` : `hsl(225,25%,${rnd(7, 12)}%)`;
      g.fillRect(x, h - bh, bw, bh);
      if (!day) for (let yy = h - bh + 8; yy < h - 8; yy += 14) for (let xx = x + 6; xx < x + bw - 6; xx += 12)
        if (Math.random() < .35) { g.fillStyle = `rgba(255,${rnd(190, 230)},120,${rnd(.5, .95)})`; g.fillRect(xx, yy, 5, 7); }
      x += bw + rnd(4, 20);
    }
    g.fillStyle = day ? '#5b7a4a' : '#0b120c';
    for (let i = 0; i < 26; i++) { g.beginPath(); g.arc(rnd(0, w), h - rnd(0, 20), rnd(24, 56), 0, Math.PI * 2); g.fill(); }
  });
}
const skyDay = skyTex(true), skyNight = skyTex(false);

// ---------- materials ----------
const M = (color, roughness = 0.7, metalness = 0, extra = {}) => new THREE.MeshStandardMaterial({ color, roughness, metalness, ...extra });
const floorMat = M(0xffffff, 0.55, 0, { map: woodTex });
const wallMat = M(0x2a2f3a, 0.92);
const accentWallMat = M(0x161a21, 0.95);
const ceilMat = M(0x262a33, 0.95);
const capMat = M(0x5c6372, 0.8);
const blackMat = M(0x16181d, 0.45, 0.2);
const metalMat = M(0x2b2e35, 0.35, 0.85);
const oakMat = M(0x8a6040, 0.6);
const slatMat = M(0x6e4a30, 0.65);
const deskMat = M(0x1b1e24, 0.5, 0.1);
const fabricMat = M(0x30343d, 0.95);
const duvetMat = M(0x1d2535, 0.95);
const sheetMat = M(0xd9dde4, 0.95);
const wardrobeMat = M(0x3a3f4a, 0.75);
const whiteMat = M(0xe9ebef, 0.5);
const glassMat = new THREE.MeshPhysicalMaterial({ color: 0xbfd8ee, roughness: 0.05, metalness: 0, transparent: true, opacity: 0.14 });
const tintGlass = new THREE.MeshPhysicalMaterial({ color: 0x222831, roughness: 0.08, metalness: 0.1, transparent: true, opacity: 0.35 });
const leafMat = M(0x2f6b3a, 0.7, 0, { side: THREE.DoubleSide });

const ledMats = [];
const ledMat = (base = 3) => { const m = new THREE.MeshStandardMaterial({ color: 0x000000, emissive: 0x00d4ff, emissiveIntensity: base, roughness: 1 }); m.userData.base = base; ledMats.push(m); return m; };

// ---------- helpers ----------
function box(w, h, d, mat, x, y, z, { r = 0, parent = scene, cast = true } = {}) {
  const geo = r > 0 ? new RoundedBoxGeometry(w, h, d, 3, r) : new THREE.BoxGeometry(w, h, d);
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z); m.castShadow = cast; m.receiveShadow = true;
  parent.add(m); return m;
}
function plane(w, h, mat, x, y, z, ry = 0, { parent = scene, cast = false } = {}) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
  m.position.set(x, y, z); m.rotation.y = ry; m.receiveShadow = true; m.castShadow = cast;
  parent.add(m); return m;
}

// ---------- shell ----------
box(W, 0.06, L, floorMat, 0, -0.03, 0, { cast: false });
const ground = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), M(0x0c0e13, 1));
ground.rotation.x = -Math.PI / 2; ground.position.y = -0.065; ground.receiveShadow = true; scene.add(ground);

// walls are single-sided planes facing inward: from outside you look straight into the room
const wall = (w, h, x, y, z, ry, mat = wallMat) => plane(w, h, mat, x, y, z, ry, { cast: true });
// north (balcony door, x -0.6 .. 0.9)
wall(0.9, H, -1.05, H / 2, -hz, 0);
wall(0.6, H, 1.2, H / 2, -hz, 0);
wall(1.5, H - 2.25, 0.15, (H + 2.25) / 2, -hz, 0);
// south (door to hallway, x -1.1 .. -0.3)
wall(0.4, H, -1.3, H / 2, hz, Math.PI);
wall(1.8, H, 0.6, H / 2, hz, Math.PI);
wall(0.8, H - 2.05, -0.7, (H + 2.05) / 2, hz, Math.PI);

// ---------- state ----------
const state = { color: '#00d4ff', rainbow: false, ledOn: true, day: false, lamp: false, inside: false };
const tmpColor = new THREE.Color();

function setLedColor(c) {
  tmpColor.set(c);
  ledMats.forEach(m => m.emissive.copy(tmpColor));
  ledLights.forEach(l => l.color.copy(tmpColor));
}
function applyLighting() {
  const { day, lamp, ledOn } = state;
  const ledK = ledOn ? (day ? 0.45 : 1) : 0;
  ledMats.forEach(m => m.emissiveIntensity = m.userData.base * (ledOn ? (day ? 0.6 : 1) : 0.0));
  ledLights.forEach(l => l.intensity = l.userData.base * ledK * (day ? 0.8 : 1.6));
  hemi.intensity = day ? 1.3 : (lamp ? 0.25 : 0.12);
  sun.intensity = day ? 3.4 : 0;
  sun.castShadow = day;
  spot.intensity = lamp ? (day ? 10 : 18) : 0;
  spot.castShadow = lamp;
  lampMat.emissiveIntensity = lamp ? 2.2 : 0.03;
  bedLamp.intensity = lamp ? 0 : (day ? 0 : 0.5);
  lampShade.material.emissiveIntensity = (!lamp && !day) ? 1.2 : 0;
  screenLight.intensity = day ? 0.3 : 1.1;
  bloom.strength = day ? 0.25 : 0.75;
  bloom.threshold = day ? 0.95 : 0.8;
  renderer.toneMappingExposure = day ? 0.95 : 1.15;
  scene.background = new THREE.Color(day ? 0xa9bccf : 0x07090e);
  ground.material.color.set(day ? 0x7c8a6a : 0x0c0e13);
  backdrop.material.map = day ? skyDay : skyNight; backdrop.material.needsUpdate = true;
  scene.traverse(o => { if (o.isMesh && o.material && 'envMapIntensity' in o.material) o.material.envMapIntensity = day ? 0.5 : 0.12; });
}
setLedColor(state.color);
applyLighting();

// ---------- views ----------
const views = {
  outside: { pos: new THREE.Vector3(4.6, 6.2, 6.4), target: new THREE.Vector3(0, 0.9, 0), min: 3.2, max: 12, polar: Math.PI * 0.47, fovP: 58, fovL: 42 },
  inside: { pos: new THREE.Vector3(0.55, 1.5, -0.95), target: new THREE.Vector3(-0.05, 1.25, 0.1), min: 0.05, max: 1.25, polar: Math.PI * 0.85, fovP: 78, fovL: 62 }
};
if (innerWidth < innerHeight) views.outside.pos.set(5.6, 7.4, 7.8);
let tween = null;
function goTo(name) {
  const v = views[name];
  controls.minDistance = 0.01; controls.maxDistance = 100;
  tween = { t: 0, fromPos: camera.position.clone(), fromTarget: controls.target.clone(), fromFov: camera.fov, v };
  controls.maxPolarAngle = v.polar;
  backdrop.visible = name === 'inside';
}
backdrop.visible = false;
const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

// ---------- UI ----------
const swatches = document.querySelectorAll('.sw');
swatches.forEach(b => b.addEventListener('click', () => {
  swatches.forEach(s => s.setAttribute('aria-pressed', String(s === b)));
  const c = b.dataset.c;
  state.rainbow = c === 'rainbow';
  state.ledOn = c !== 'off';
  if (state.ledOn && !state.rainbow) { state.color = c; setLedColor(c); document.documentElement.style.setProperty('--accent', c); }
  applyLighting();
}));
const btnLamp = document.getElementById('btnLamp');
btnLamp.addEventListener('click', () => { state.lamp = !state.lamp; btnLamp.setAttribute('aria-pressed', String(state.lamp)); applyLighting(); });
const btnDay = document.getElementById('btnDay');
btnDay.addEventListener('click', () => {
  state.day = !state.day; btnDay.setAttribute('aria-pressed', String(state.day));
  btnDay.querySelector('span').textContent = state.day ? 'Noc' : 'Dzień'; applyLighting();
});
const btnView = document.getElementById('btnView');
btnView.addEventListener('click', () => {
  state.inside = !state.inside; btnView.setAttribute('aria-pressed', String(state.inside));
  btnView.querySelector('span').textContent = state.inside ? 'Z góry' : 'W środku';
  goTo(state.inside ? 'inside' : 'outside');
});
const hint = document.getElementById('hint');
controls.addEventListener('start', () => hint.classList.add('gone'), { once: true });
setTimeout(() => hint.classList.add('gone'), 7000);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  const v = state.inside ? views.inside : views.outside;
  camera.fov = innerWidth < innerHeight ? v.fovP : v.fovL;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  bloom.resolution.set(innerWidth / 2, innerHeight / 2);
});

// ---------- loop ----------
const clock = new THREE.Clock();
let first = true;
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  if (tween) {
    tween.t = Math.min(1, tween.t + dt / 1.1);
    const k = ease(tween.t), v = tween.v;
    camera.position.lerpVectors(tween.fromPos, v.pos, k);
    controls.target.lerpVectors(tween.fromTarget, v.target, k);
    camera.fov = THREE.MathUtils.lerp(tween.fromFov, innerWidth < innerHeight ? v.fovP : v.fovL, k);
    camera.updateProjectionMatrix();
    if (tween.t >= 1) { controls.minDistance = v.min; controls.maxDistance = v.max; tween = null; }
  }
  if (state.rainbow && state.ledOn) setLedColor(tmpColor.setHSL((t * 0.06) % 1, 1, 0.55).getHexString().padStart(7, '#'));
  screenLight.intensity = (state.day ? 0.3 : 1.1) * (0.92 + Math.sin(t * 3.1) * 0.04 + Math.sin(t * 7.3) * 0.03);
  controls.update();
  eastDecor.visible = camera.position.x < hx + 0.1;
  doorLeaf.visible = camera.position.z < hz + 0.1;
  composer.render();
  if (first) { first = false; document.getElementById('loading').classList.add('done'); }
});
</script>
